{% extends "base.html" %}
{% block content %}
<h1>Мои парковки</h1>
<table class="table mt-20">
    <thead><tr><th>Название</th><th>Адрес</th><th>Действия</th></tr></thead>
    <tbody>
    {% for p in parkings %}
    <tr>
        <td>{{ p.name }}</td>
        <td>{{ p.address }}</td>
        <td>
            <a href="{{ url_for('admin_parking', parking_id=p.id) }}" class="btn-primary btn-sm">Управление</a>
            <a href="{{ url_for('admin_bookings', parking_id=p.id) }}" class="btn-secondary btn-sm">Брони</a>
            <a href="{{ url_for('admin_reviews', parking_id=p.id) }}" class="btn-secondary btn-sm">Отзывы</a>
        </td>
    </tr>
    {% else %}
    <tr><td colspan="3" class="muted">У вас нет назначенных парковок.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
