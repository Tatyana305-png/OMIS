{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <h1>Создание аккаунта</h1>
    <form method="post">
        <label>ФИО <input name="full_name" required placeholder="Иванов Иван Иванович"></label>
        <label>Email <input type="email" name="email" required placeholder="name@example.com"></label>
        <label>Дата рождения <input type="date" name="birth_date"></label>
        <label>Пароль <input type="password" name="password" required placeholder="Минимум 6 символов"></label>
        <label>Повторите пароль <input type="password" name="password2" required placeholder="••••••••"></label>
        <button class="btn-primary btn-block" type="submit">Зарегистрироваться</button>
    </form>
    <div class="auth-footer">
        <a href="{{ url_for('login') }}">Уже есть аккаунт? Войти</a>
    </div>
</div>
{% endblock %}
