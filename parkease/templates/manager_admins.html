{% extends "base.html" %}
{% block content %}
<h1>Администраторы парковки</h1>

<!-- Выпадающий список для переключения парковок -->
<div class="parking-switcher">
    <select onchange="window.location.href='/manager/parking/' + this.value + '/admins'">
        {% for p in my_parkings %}
            <option value="{{ p.id }}" {% if p.id == parking.id %}selected{% endif %}>
                {{ p.name }}
            </option>
        {% endfor %}
    </select>
</div>

<div class="manager-admin-layout mt-20">
    <!-- ЛЕВАЯ КАРТОЧКА С ТАБЛИЦЕЙ -->
    <div class="card" style="padding: 0; overflow: hidden;">
        <table class="table" style="margin: 0; box-shadow: none; width: 100%; table-layout: auto;">
            <thead>
                <tr>
                    <th style="width: 40%; padding: 15px 10px;">ФИО</th>
                    <th style="width: 40%; padding: 15px 10px;">Email</th>
                    <th style="width: 20%; text-align: right; padding-right: 20px;">Действия</th>
                </tr>
            </thead>
            <tbody>
            {% for a in admins %}
                <tr>
                    <td style="padding: 15px 10px;">{{ a.full_name }}</td>
                    <td style="padding: 15px 10px;">{{ a.email }}</td>
                    <td style="padding: 15px 10px; text-align: right; padding-right: 20px;">
                        <form method="post" action="{{ url_for('manager_remove_admin', parking_id=parking.id, user_id=a.id) }}" style="display: inline;">
                            <button class="btn-danger btn-sm" type="submit">Удалить</button>
                        </form>
                    </td>
                </tr>
            {% else %}
                <tr>
                    <td colspan="3" class="muted text-center" style="padding: 20px;">Администраторов нет</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- ПРАВАЯ КАРТОЧКА С ФОРМОЙ -->
    <div class="card" style="align-self: start;">
        <h2>Добавить администратора</h2>
        <form method="post">
            <label>Email пользователя
                <input name="email" type="email" placeholder="user@example.com" required>
            </label>
            <p class="muted">Если аккаунта нет, он будет создан (пароль по умолчанию: 123456).</p>
            <button class="btn-primary btn-block mt-10" type="submit">Добавить в список</button>
        </form>
    </div>
</div>
{% endblock %}
